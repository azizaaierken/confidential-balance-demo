name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  console:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      # The platform builds with this base path; a link or asset that is not
      # `base`-prefixed only breaks there, so build it in CI too.
      - run: bun run build
        env:
          BASE_PATH: /confidential-balances
