[package]
name = "rust-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "spike"
path = "src/bin/spike.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[lib]
name = "rust_service"
path = "src/lib.rs"

[dependencies]
solana-sdk = "3.0.0"
solana-client = "3.1.6"
solana-zk-sdk = "6.0.1"
solana-system-interface = { version = "3.0.0", features = ["bincode"] }
solana-commitment-config = "3.1.0"

spl-token-2022 = { version = "10.0.0", features = ["zk-ops"] }
spl-token-client = "0.18.0"
spl-associated-token-account = "8.0.0"
spl-token-confidential-transfer-proof-extraction = "0.5.1"
spl-token-confidential-transfer-proof-generation = "0.6.0"

solana-zk-elgamal-proof-interface = "0.1.2"
solana-zk-sdk-pod = "0.1.1"
solana-address = "2.6"
bytemuck = "1.25"
spl-record = { version = "0.4.0", features = ["no-entrypoint"] }

tokio = { version = "1", features = ["full"] }

axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
